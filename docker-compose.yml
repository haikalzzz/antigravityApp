version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: testapp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testapp_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      # Port 3306 dibuka ke host komputer agar dapat diakses langsung oleh DBeaver
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: testapp_server
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: testapp_db
      JWT_SECRET: super_secret_saucedemo_jwt_token_key_2026
      NODE_ENV: production
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./server.js:/app/server.js
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
